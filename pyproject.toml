[project]
name = "rsvp-reader"
version = "0.1.0"
description = "Local RSVP reader with a PDF ingestion pipeline for course readings"
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "wordfreq>=3.0",
]

[project.scripts]
rsvp = "rsvp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
